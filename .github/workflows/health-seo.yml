name: Health and SEO

on:
 push:
  branches:
   - main
   - master
 pull_request:

jobs:
 health:
  runs-on: ubuntu-24.04

  steps:
   - name: Checkout
     uses: actions/checkout@v7

   - name: Use Node.js
     uses: actions/setup-node@v7
     with:
      node-version: 22
      cache: npm

   - name: Install dependencies
     run: npm ci

   - name: Run project health checks
     run: npm run health

   - name: Run SEO assertions
     run: npm run seo:check
